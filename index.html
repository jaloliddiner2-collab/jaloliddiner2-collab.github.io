<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaloliddin Erkinov</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Asosiy ixcham kartochka */
        .card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 32px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Profil belgisi (Avatar) */
        .avatar {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #06b6d4, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: #09090b;
        }

        h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        
        .role {
            font-size: 13px;
            color: #10b981;
            font-weight: 600;
            margin-bottom: 14px;
        }

        p {
            font-size: 14px;
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Ko'nikmalar teglari */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .skills span {
            background: #27272a;
            color: #e4e4e7;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 10px;
        }

        /* Bog'lanish tugmalari */
        .links { display: flex; flex-direction: column; gap: 10px; }

        .btn {
            display: block;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            background: #27272a;
            color: #ffffff;
            transition: 0.2s;
        }

        .btn:hover { background: #3f3f46; transform: translateY(-2px); }

        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #10b981);
            color: #09090b;
        }

        .btn-primary:hover { opacity: 0.9; background: linear-gradient(135deg, #06b6d4, #10b981); }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">JE</div>
        <h1>Jaloliddin Erkinov</h1>
        <div class="role">IT & Kiberxavfsizlik • Veb-dasturchi</div>
        
        <p>
            Salom! Men zamonaviy veb-saytlar yaratish, kiberxavfsizlik va raqamli dizayn bilan shug‘ullanaman.
        </p>

        <div class="skills">
            <span>HTML / CSS</span>
            <span>Cybersecurity</span>
            <span>UI Dizayn</span>
            <span>Gaming</span>
        </div>

        <div class="links">
            <a href="https://t.me/erkinov637" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Telegram orqali yozish</a>
            <a href="https://www.youtube.com/@ErkinovJaloliddin1" target="_blank" rel="noopener noreferrer" class="btn">YouTube kanalim</a>
            <a href="https://instagram.com/shuxratovich.637" target="_blank" rel="noopener noreferrer" class="btn">Instagram Kanalim</a>
        </div>
    </div>

</body>
</html>
