<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaloliddin Erkinov</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Tun rejimi (boshlang'ich holat) */
        :root {
            --bg-page: #09090b;
            --bg-card: #18181b;
            --border-card: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #10b981;
            --tag-bg: #27272a;
            --tag-text: #e4e4e7;
            --btn-bg: #27272a;
            --btn-hover: #3f3f46;
            --btn-text: #ffffff;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Kun rejimi */
        body.light {
            --bg-page: #f4f4f5;
            --bg-card: #ffffff;
            --border-card: #e4e4e7;
            --text-main: #09090b;
            --text-muted: #52525b;
            --accent: #059669;
            --tag-bg: #f4f4f5;
            --tag-text: #27272a;
            --btn-bg: #f4f4f5;
            --btn-hover: #e4e4e7;
            --btn-text: #09090b;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.25s, color 0.25s;
        }

        .card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 32px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        /* Tun / Kun almashtirish tugmasi */
        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--tag-bg);
            color: var(--text-main);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .theme-toggle:hover {
            background: var(--btn-hover);
        }

        .avatar {
            width: 76px;
            height: 76px;
            margin: 10px auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #06b6d4, #10b981);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: #09090b;
        }

        h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }

        .role {
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 14px;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .skills span {
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .links { display: flex; flex-direction: column; gap: 10px; }

        .btn {
            display: block;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            background: var(--btn-bg);
            color: var(--btn-text);
            transition: 0.2s;
        }

        .btn:hover { background: var(--btn-hover); transform: translateY(-2px); }

        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #10b981);
            color: #09090b;
        }

        .btn-primary:hover { opacity: 0.9; background: linear-gradient(135deg, #06b6d4, #10b981); }
    </style>
</head>
<body>

    <div class="card">
        <button type="button" class="theme-toggle" id="themeBtn">☀️ Kun</button>

        <div class="avatar">J.E</div>
        <h1>Jaloliddin Erkinov</h1>
        <div class="role">IT & Kiberxavfsizlik • Veb-dasturchi</div>

        <p>
            Salom! Men zamonaviy veb-saytlar yaratish, kiberxavfsizlik va raqamli dizayn bilan shug‘ullanaman.
        </p>

        <div class="skills">
            <span>HTML / CSS</span>
            <span>Cybersecurity</span>
            <span>UI Dizayn</span>
            <span>Gaming</span>
        </div>

        <div class="links">
            <a href="https://t.me/erkinov637" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Telegram orqali yozish</a>
            <a href="https://www.youtube.com/@ErkinovJaloliddin1" target="_blank" rel="noopener noreferrer" class="btn">YouTube kanalim</a>
            <a href="https://instagram.com/shuxratovich.637" target="_blank" rel="noopener noreferrer" class="btn">Instagram Kanalim</a>
        </div>
    </div>

    <script>
        const themeBtn = document.getElementById('themeBtn');

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            themeBtn.textContent = isLight ? '🌙 Tun' : '☀️ Kun';
        });
    </script>

</body>
</html>
